<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meramasa - Filipino Artisan Bakery</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Open+Sans&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Header + Navbar -->
    <div class="header-container" id="headerContainer">
      <div class="floating-header">
        All orders will be ready for pickup on our next business day between
        9:00 AM and 5:00 PM
      </div>

      <div class="navbar">
        <div class="logo">
          <a href="index.html">
            <img src="img/mera1.png" alt="Meramasa Logo" />
          </a>
        </div>
        <div class="nav-center">
          <!-- <ul class="nav-links">
            <li><a href="index3.html">Home</a></li>
            <li><a href="img/menu.jpg" target="_blank">Menu</a></li>
            <li><a href="order.html">Orders</a></li>
            <li><a href="#">Contact</a></li>
          </ul> -->
        </div>
      </div>
    </div>

    <!-- Page content -->
    <div class="content">
      <!-- Hero Banner -->
      <div class="hero-banner">
        <img src="img/1.png" alt="Bakery Banner" />
        <a href="order.html" class="hero-btn">Order Now</a>
      </div>
    </div>

    <section class="gallery" id="gallery">
      <h2>Gallery</h2>
      <div class="gallery-grid">
        <img src="img\ubepandesal.jpg" alt="Bread" />
        <img src="img\ensaymada.jpg" alt="Bakery" />
        <img src="img\cheeseroll.jpg" alt="Filipino Food" />
      </div>
    </section>

    <section class="contact" id="contact">
      <h2>Contact Us</h2>
      <p><strong>Address:</strong> La Puente CA, 91744</p>
      <p><strong>Phone:</strong> +1 (626)420-1884</p>
      <!-- <p><strong>Email:</strong> hello@meramasa.com</p> -->
      <p>
        <strong>Instagram:</strong>
        <a href="https://instagram.com/meramasabakeshop" target="_blank"
          >@meramasabakeshop</a
        >
      </p>
    </section>

    <!-- Footer -->
    <footer>&copy; 2025 Meramasa Bakery. All rights reserved.</footer>

    <!-- Scroll hide/show script -->
    <script>
      let lastScrollY = window.scrollY;
      const headerContainer = document.getElementById("headerContainer");

      window.addEventListener("scroll", () => {
        if (window.scrollY > lastScrollY) {
          headerContainer.classList.add("hidden");
        } else {
          headerContainer.classList.remove("hidden");
        }
        lastScrollY = window.scrollY;
      });
    </script>
  </body>
</html>
